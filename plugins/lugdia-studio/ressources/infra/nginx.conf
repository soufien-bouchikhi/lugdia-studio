# nginx d'un site client Lugdia : sert le build Astro (format « directory » : /contact -> /contact/index.html).
# Modèle tiré de lugdia.fr. À copier dans infra/ du projet. La CSP se règle ici, d'abord en Report-Only sur l'aperçu.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens off;

    # gzip ici ; Brotli éventuel par le middleware de compression de Traefik
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Politique de sécurité du contenu : à compléter avec l'origine du webhook n8n et de la mesure d'audience.
    # Remplacer WEBHOOK et AUDIENCE par leurs origines (https://…). Sur l'aperçu, utiliser d'abord
    # Content-Security-Policy-Report-Only, vérifier la console de chaque page, puis passer à Content-Security-Policy.
    # Astro peut intégrer de petites feuilles de style dans la page : régler build.inlineStylesheets sur « never »
    # (astro.config.mjs) plutôt que d'ouvrir style-src à 'unsafe-inline'.
    set $csp "default-src 'self'; script-src 'self' AUDIENCE; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' WEBHOOK AUDIENCE; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

    # fichiers du build : nom avec empreinte, gardés un an
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy $csp;
        try_files $uri =404;
    }

    # pages : toujours revalidées, pour qu'une mise à jour se voie tout de suite
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp;
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
}
